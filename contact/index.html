<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write to Zach</title>
  <meta name="description" content="Send a message to Zach Fisher.">
  <link rel="canonical" href="https://zachfisher.com/contact/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact Zach Fisher">
  <meta property="og:description" content="Send a message to Zach Fisher.">
  <meta property="og:url" content="https://zachfisher.com/contact/">
  <meta property="og:image" content="https://zachfisher.com/images/me.jpg">
  <meta property="og:image:width" content="450">
  <meta property="og:image:height" content="450">
  <meta property="og:image:alt" content="Zach Fisher">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css2?family=Raleway:wght@400&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
  <link href="/styles/zach.css?v=23" rel="stylesheet">

  <style>
    form {
      max-width: 620px;
      margin: 0 auto;
      text-align: left;
    }

    .form-intro {
      max-width: 620px;
      margin: 0 auto 20px;
      font-size: 12.5pt;
      color: var(--muted);
    }

    p.back-top {
      max-width: 620px;
      margin: 0 auto 18px;
      text-align: left;
    }

    .back-top a {
      margin-left: -10px;
    }

    .field-row {
      display: flex;
      gap: 14px;
    }

    .field {
      flex: 1;
      margin-bottom: 14px;
    }

    /* Placeholders alone leave nothing for a screen reader to announce. */
    .field label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    input,
    textarea {
      box-sizing: border-box;
      width: 100%;
      font: 13pt/1.4 'Raleway', -apple-system, Helvetica, sans-serif;
      padding: 9px 11px;
      border: 1px solid var(--input-border);
      border-radius: 7px;
      background: var(--input-background);
      color: var(--text);
      transition: border-color 0.15s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--link);
    }

    textarea {
      display: block;
      height: 170px;
      resize: vertical;
    }

    button {
      margin: 1.4em auto 0;
      display: block;
      padding: 9px 28px;
      border: none;
      border-radius: 7px;
      background: var(--link);
      color: #fff;
      font-family: 'Raleway', -apple-system, Helvetica, sans-serif;
      font-size: 14pt;
      cursor: pointer;
      transition: filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    @media all and (max-width: 380px) {
      .field-row {
        display: block;
      }
    }
  </style>
</head>

<body>
  <div class="content">
    <p class="back back-top"><a href="/" class="back"><i class="arrow left"></i> Zach Fisher</a></p>
    <h1>Write to Zach</h1>

    <p class="form-intro">Feel free to contact me about anything, work-related or otherwise</p>

    <form id="contact" action="https://contact.zachfisher.com/submit" method="POST">
      <div class="field-row">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" placeholder="Your name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" placeholder="Your email" autocomplete="email"
                 pattern="[^@\s]+@[^@\s]+\.[^@\s]+" required>
        </div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Message" required></textarea>
      </div>

      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAABgcSnswh-1MbkB0"
           data-callback="onCaptcha"
           data-appearance="interaction-only"
           data-size="normal">
      </div>

      <button type="submit">Send</button>
    </form>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    // The browser validates the fields before this fires, so all that is left
    // here is the Turnstile handshake.
    let pendingTurnstile = false;
    const contactForm = document.getElementById('contact');

    contactForm.addEventListener('submit', function (event) {
      if (this['cf-turnstile-response']?.value) {
        return;
      }
      event.preventDefault();
      if (typeof turnstile === 'undefined') {
        // The widget never loaded. Send anyway and let the server decide,
        // rather than leaving the button silently dead.
        this.submit();
        return;
      }
      pendingTurnstile = true;
      turnstile.execute();
    });

    function onCaptcha() {
      if (pendingTurnstile) {
        pendingTurnstile = false;
        contactForm.submit();
      }
    }
  </script>
</body>
</html>
