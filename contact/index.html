<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write to Zach</title>
  <meta name="description" content="Send a message to Zach Fisher.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css2?family=Raleway:wght@400&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
  <link href="/styles/zach.css?v=20" rel="stylesheet">

  <style>
    form {
      max-width: 700px;
      margin: 0 auto;
    }
    input, textarea {
      width: 98%;
      font: 13pt/1.4 'Raleway', -apple-system, Helvetica, sans-serif;
      padding: 6px;
      border: 1px solid var(--input-border);
      border-radius: 5px;
      background: var(--input-background);
      color: var(--text);
      transition: border-color 0.15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--link);
    }
    input {
      width: 47%;
    }
    textarea {
      height: 160px;
      resize: vertical;
    }
    button {
      margin: 1.2em auto 0;
      display: block;
      padding: 8px 26px;
      border: none;
      border-radius: 6px;
      background: var(--link);
      color: #fff;
      font-family: 'Raleway', -apple-system, Helvetica, sans-serif;
      font-size: 14pt;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    button:hover {
      filter: brightness(1.1);
    }
    @media all and (max-width: 700px) {
      input {
        width: 42%;
      }
      textarea {
        width: 96%;
      }
      p {
        padding-left: 3%;
        padding-right: 3%;
      }
    }
  </style>
</head>

<body>
  <div class="content">
    <h1>Write to Zach</h1>

    <form id="contact" action="https://contact.zachfisher.com/submit" method="POST" novalidate>
      <p><input name="name"  placeholder="Your name"           required>
         <input name="email" type="email" placeholder="Your email" required style="float:right"></p>

      <p><textarea name="message" placeholder="Message" required></textarea></p>


      <div class="cf-turnstile"
           data-sitekey="0x4AAAAAABgcSnswh-1MbkB0"
           data-callback="onCaptcha"
           data-appearance="interaction-only"
           data-size="normal">
      </div>

      <button type="submit">Send</button>
    </form>
  </div>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    let pendingTurnstile = false;

    document.getElementById('contact').addEventListener('submit', function (e) {
      const name    = this.name.value.trim();
      const email   = this.email.value.trim();
      const message = this.message.value.trim();
      if (!name || !email || !message ||
          !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('Please fill in all fields with a valid email.');
        e.preventDefault();
        return;
      }
      if (!this['cf-turnstile-response']?.value) {
        e.preventDefault();
        pendingTurnstile = true;
        turnstile.execute();
        return;
      }
    });

    function onCaptcha() {
      if (pendingTurnstile) {
        pendingTurnstile = false;
        document.getElementById('contact').submit();
      }
    }
  </script>
</body>
</html>
